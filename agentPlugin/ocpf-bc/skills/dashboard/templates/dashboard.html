<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OnlyBCFans BC Agentic Dev Framework Dashboard</title>
<!-- Rendered by the OCPF BC Agentic Development Framework's dashboard skill. Do not edit: every refresh overwrites this file.
     Data is embedded below in <script id="ocpf-data">; the page needs no server and no network (the fonts are optional). -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,400..900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg:#eef0f4; --surface:#ffffff; --surface-2:#f6f7f9; --border:#e2e5ea;
    --text:#0b1220; --text-2:#4b5565; --text-3:#8a93a3;
    --main:#2a78d6; --reasoning:#4a3aa7; --light:#1baf7a;
    --seq-500:#256abf; --seq-650:#104281;
    --good:#0ca30c; --warning:#fab219; --critical:#d03b3b; --track:#dde1e7;
    --fw:#0e7f87; --wait-bg:rgba(250,178,25,.14); --wait-b:rgba(250,178,25,.45); --wait-t:#5a3d00; --wait-h:#3a2800; --wait-rule:rgba(138,90,0,.35);
    --on-bg:rgba(12,163,12,.12); --on-t:#0a6e0a; --toast:rgba(11,18,32,.92); --shadow:rgba(11,18,32,.25);
    --a1:rgba(190,214,255,.9); --a2:rgba(214,206,255,.9); --a3:rgba(200,240,224,.9); --aurora-op:.8;
    --donut-t:#0b1220; --wait-amber:#8a5a00; --btn:#0b1220; --btn-t:#fff;
  }
  /* ---------- night mode ---------- */
  :root[data-theme="dark"]{color-scheme:dark;
    --bg:#0b1220; --surface:#141c2e; --surface-2:#1b2439; --border:#26304a;
    --text:#eef2f8; --text-2:#aab6cc; --text-3:#6f7d99;
    --main:#5aa2ff; --reasoning:#9d8cff; --light:#2fd39a; --seq-500:#4a8fe0; --seq-650:#8fc3ff;
    --good:#2fd36a; --warning:#ffc14d; --track:#26304a;
    --fw:#5fd3dc; --wait-bg:rgba(255,193,77,.12); --wait-b:rgba(255,193,77,.4); --wait-t:#ffd99a; --wait-h:#ffe7bd; --wait-rule:rgba(255,193,77,.3);
    --on-bg:rgba(47,211,106,.14); --on-t:#7ff0a8; --toast:rgba(20,28,46,.96); --shadow:rgba(0,0,0,.6);
    --a1:rgba(42,120,214,.35); --a2:rgba(106,90,224,.32); --a3:rgba(23,181,138,.25); --aurora-op:1;
    --donut-t:#eef2f8; --wait-amber:#ffc14d; --btn:#eef2f8; --btn-t:#0b1220;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0b1220; --surface:#141c2e; --surface-2:#1b2439; --border:#26304a;
    --text:#eef2f8; --text-2:#aab6cc; --text-3:#6f7d99;
    --main:#5aa2ff; --reasoning:#9d8cff; --light:#2fd39a; --seq-500:#4a8fe0; --seq-650:#8fc3ff;
    --good:#2fd36a; --warning:#ffc14d; --track:#26304a;
    --fw:#5fd3dc; --wait-bg:rgba(255,193,77,.12); --wait-b:rgba(255,193,77,.4); --wait-t:#ffd99a; --wait-h:#ffe7bd; --wait-rule:rgba(255,193,77,.3);
    --on-bg:rgba(47,211,106,.14); --on-t:#7ff0a8; --toast:rgba(20,28,46,.96); --shadow:rgba(0,0,0,.6);
    --a1:rgba(42,120,214,.35); --a2:rgba(106,90,224,.32); --a3:rgba(23,181,138,.25); --aurora-op:1;
    --donut-t:#eef2f8; --wait-amber:#ffc14d; --btn:#eef2f8; --btn-t:#0b1220;
  }}
  html{transition:background .4s}
  body,.tile,.panel,.card,.pill,.feed,.spurchip,.st .node,.toast,.wait{transition:background-color .4s,border-color .4s,color .4s}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg)}
  body{color:var(--text);font:14px/1.45 -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;position:relative;overflow-x:hidden}
  /* living backdrop */
  .aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;opacity:var(--aurora-op)}
  .aurora i{position:absolute;border-radius:50%;width:900px;height:900px;animation:float 18s ease-in-out infinite alternate}
  .aurora i:nth-child(1){left:0;top:-5%;background:radial-gradient(circle,var(--a1) 0%,transparent 65%)}
  .aurora i:nth-child(2){right:-5%;top:5%;background:radial-gradient(circle,var(--a2) 0%,transparent 65%);animation-duration:23s;animation-delay:-6s}
  .aurora i:nth-child(3){left:30%;bottom:-15%;background:radial-gradient(circle,var(--a3) 0%,transparent 65%);animation-duration:27s;animation-delay:-12s}
  @keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(90px,60px) scale(1.15)}}
  .wrap{position:relative;z-index:1;width:1400px;margin:0 auto;padding:20px 20px 28px}

  /* entrance */
  .in{opacity:0;transform:translateY(14px);animation:in .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
  @keyframes in{to{opacity:1;transform:none}}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{width:48px;height:48px;display:grid;place-items:center;position:relative}
  .brand .logo img{width:48px;height:48px;display:block;filter:drop-shadow(0 6px 12px rgba(14,127,135,.25))}
  .brand .fw{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fw);margin-bottom:1px}
  .brand .appic{width:22px;height:22px;vertical-align:-4px;margin-right:4px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
  @keyframes sheen{0%,75%{transform:translateX(-80%)}100%{transform:translateX(80%)}}
  .brand h1{margin:0;font-size:18px;font-weight:650}
  .brand .sub{color:var(--text-2);font-size:12.5px}
  .hright{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
  .pillrow{display:flex;gap:10px;align-items:center}
  .bcmark{width:64px;height:64px;display:block;margin-right:4px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.18))}  /* Microsoft Dynamics 365 Business Central product icon — identifies the platform; see THIRD_PARTY_NOTICES.md */
  .pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:12.5px;color:var(--text-2);box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .pill b{color:var(--text);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:ping 1.6s ease-out infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(12,163,12,.5)}100%{box-shadow:0 0 0 9px rgba(12,163,12,0)}}
  .tool-ic{width:18px;height:18px;display:grid;place-items:center}
  .tool-ic svg{width:100%;height:100%;display:block}
  .tool-cc svg{fill:#d97757}.tool-gh svg{fill:currentColor}  /* Claude: Anthropic's brand orange; Copilot: the Octicon, monochrome */
  .pill.theme{cursor:pointer;font:inherit;gap:6px}
  .pill.theme:hover{border-color:var(--main)}
  .mcp{width:8px;height:8px;border-radius:50%;background:var(--main);animation:ping2 2.4s ease-out infinite}
  @keyframes ping2{0%{box-shadow:0 0 0 0 rgba(42,120,214,.5)}100%{box-shadow:0 0 0 8px rgba(42,120,214,0)}}

  /* tiles */
  .tiles{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr 1.6fr;gap:12px;margin-bottom:14px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px -16px var(--shadow);transition:transform .3s}
  .tile .k{color:var(--text-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
  .tile .v{font-size:26px;font-weight:650;letter-spacing:-.01em;line-height:1.1;font-variant-numeric:tabular-nums}
  .tile .v small{font-size:13px;color:var(--text-2);font-weight:500;margin-left:4px}
  .tile .m{color:var(--text-3);font-size:12px;margin-top:4px}
  .spark{position:absolute;right:12px;top:12px;width:92px;height:30px;opacity:.9}
  .spark path.l{fill:none;stroke:var(--main);stroke-width:1.8;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 2.2s ease-out 1s forwards}
  .spark path.a{fill:url(#sg);opacity:0;animation:fade 1s ease 2.4s forwards}
  .spark circle{opacity:0;animation:fade .4s ease 3.1s forwards, ping3 1.6s ease-out 3.2s infinite}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  @keyframes ping3{0%{r:2.5}50%{r:4}100%{r:2.5}}
  .tick{display:inline-block;color:var(--good);font-size:11px;font-weight:600;margin-left:6px;opacity:0;animation:fade .5s ease 2.8s forwards}
  .est .bar{position:relative;height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);margin:8px 0 6px;overflow:visible}
  .est .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:linear-gradient(90deg,#4ea0ff,var(--main));animation:fill 2s cubic-bezier(.3,.8,.2,1) 1s forwards;overflow:hidden}
  .est .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:shimmer 2.2s linear infinite}
  @keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  @keyframes fill{to{width:71%}}
  .est .mark{position:absolute;left:100%;top:-5px;bottom:-5px;width:2px;background:var(--text);transform:translateX(-1px)}
  .est .head{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--main);left:0;margin-left:-7px;animation:head 2s cubic-bezier(.3,.8,.2,1) 1s forwards;box-shadow:0 0 0 4px rgba(42,120,214,.15)}
  @keyframes head{to{left:71%}}
  .est .legend{display:flex;justify-content:space-between;color:var(--text-2);font-size:12px}
  .status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--text)}
  .status .sw{width:9px;height:9px;border-radius:2px;animation:breathe 2s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}

  /* journey */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px -16px var(--shadow);position:relative;overflow:hidden}
  .panel h2{margin:0 0 2px;font-size:14px;font-weight:650;display:flex;justify-content:space-between;align-items:center}
  .panel .hint{color:var(--text-3);font-size:12px;margin-bottom:14px}
  .phases{display:grid;grid-template-columns:4fr 2fr 3fr 5fr;margin-bottom:6px}
  .phase{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-2);padding:0 6px 6px;border-bottom:2px solid var(--border);margin-right:8px;position:relative}
  .phase::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--seq-500)}
  .phase.done::after{animation:line .8s ease forwards}
  .phase.now{color:var(--main)}.phase.now::after{background:var(--main);animation:line 1s ease 1.6s forwards}
  .phase.done:nth-child(1)::after{animation-delay:.4s}.phase.done:nth-child(2)::after{animation-delay:1.1s}
  @keyframes line{to{width:100%}}
  .line{position:relative;height:205px;margin-top:14px}
  .rail{position:absolute;left:20px;right:20px;top:20px;height:6px;background:var(--track);border-radius:3px}
  .rail .prog{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--seq-500),var(--main));border-radius:3px;animation:prog 2.4s cubic-bezier(.4,.1,.2,1) .4s forwards;box-shadow:0 0 12px rgba(42,120,214,.5)}
  @keyframes prog{to{width:51.8%}}
  .comet{position:absolute;top:-3px;left:0;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--main);margin-left:-6px;animation:comet 2.4s cubic-bezier(.4,.1,.2,1) .4s forwards;box-shadow:0 0 0 6px rgba(42,120,214,.18),0 0 18px rgba(42,120,214,.6)}
  .comet::before{content:"";position:absolute;right:8px;top:1px;width:70px;height:4px;background:linear-gradient(90deg,transparent,rgba(42,120,214,.7));border-radius:2px}
  @keyframes comet{to{left:51.8%}}
  .pulse{position:absolute;left:51.8%;top:-7px;width:20px;height:20px;margin-left:-10px;border-radius:50%;border:2px solid var(--main);opacity:0;animation:pulse 2s ease-out 2.9s infinite}
  .pulse.p2{animation-delay:3.6s}
  @keyframes pulse{0%{transform:scale(.5);opacity:.8}100%{transform:scale(3.2);opacity:0}}
  .st{position:absolute;top:12px;width:94px;margin-left:-47px;text-align:center;opacity:0;animation:pop .45s cubic-bezier(.2,1.3,.3,1) forwards;animation-delay:var(--d)}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.6)}to{opacity:1;transform:none}}
  .st .node{width:22px;height:22px;border-radius:50%;margin:0 auto;background:var(--surface);border:3px solid var(--track);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--text-2)}
  .st.done .node{background:var(--seq-500);border-color:var(--seq-500);color:#fff}
  .st.done .node::after{content:"✓";font-size:11px}
  .st.now .node{width:30px;height:30px;margin-top:-4px;background:var(--surface);border-color:var(--main);color:var(--main);box-shadow:0 0 0 6px rgba(42,120,214,.18),0 0 0 12px rgba(42,120,214,.07);animation:nodeGlow 2s ease-in-out infinite}
  @keyframes nodeGlow{0%,100%{box-shadow:0 0 0 6px rgba(42,120,214,.18),0 0 0 12px rgba(42,120,214,.07)}50%{box-shadow:0 0 0 8px rgba(42,120,214,.28),0 0 0 16px rgba(42,120,214,.1),0 0 24px rgba(42,120,214,.5)}}
  .st .id{margin-top:8px;font-size:11px;font-weight:700;color:var(--text-2)}
  .st.now .id{color:var(--main);margin-top:4px}
  .st.now .id::after{content:"";animation:dots 1.5s steps(4,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  .st .nm{font-size:11.5px;color:var(--text-2);line-height:1.25}
  .st.now .nm{color:var(--text);font-weight:600}
  .st .meta{font-size:11px;color:var(--text-3);margin-top:3px}
  .st.todo .nm,.st.todo .id{color:var(--text-3)}

  .spur{position:absolute;top:20px;width:2px;background:var(--track);transform-origin:top;transform:scaleY(0);animation:grow .5s ease forwards;animation-delay:var(--d)}
  @keyframes grow{to{transform:scaleY(1)}}
  .spur.r{background:var(--reasoning)}.spur.l{background:var(--light)}
  .spurchip{position:absolute;display:flex;gap:8px;align-items:center;padding:6px 10px 6px 6px;background:var(--surface);border:1px solid var(--border);border-radius:9px;font-size:11.5px;color:var(--text-2);line-height:1.3;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.05);opacity:0;transform:translateX(-10px);animation:slide .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d)}
  @keyframes slide{to{opacity:var(--o,1);transform:none}}
  .spurchip b{color:var(--text)}
  .spurchip.r{border-color:var(--reasoning);box-shadow:0 0 0 0 rgba(74,58,167,.3);animation:slide .5s cubic-bezier(.2,.8,.2,1) forwards, ringR 2.2s ease-out 3.6s infinite}
  @keyframes ringR{0%{box-shadow:0 0 0 0 rgba(74,58,167,.35)}100%{box-shadow:0 0 0 10px rgba(74,58,167,0)}}
  .sc-av{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;position:relative}
  .spin{position:absolute;inset:-4px;border-radius:9px;border:2px solid transparent;border-top-color:var(--reasoning);border-right-color:var(--reasoning);animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* data packets travelling along the spur */
  .pkt{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--reasoning);left:703px;top:112px;opacity:0;animation:pkt 1.6s ease-in-out 3.6s infinite}
  .pkt.b{animation-delay:4.4s}
  @keyframes pkt{0%{top:112px;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:128px;opacity:0}}

  /* lower grid */
  .grid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px}
  .grid.asking{grid-template-columns:1.15fr 1.15fr 1fr 1fr}
  .grid:not(.asking) .ask{display:none}
  .ask{border-color:var(--good);box-shadow:0 0 0 2px rgba(47,211,106,.15),0 0 24px rgba(47,211,106,.18);animation:in .6s cubic-bezier(.2,.8,.2,1) forwards, waitGlow 2.6s ease-in-out 1.6s infinite}
  .ask h3{color:var(--good)}
  .ask .q{font-size:13.5px;line-height:1.45;color:var(--text);margin-bottom:12px}
  .ask .opts{display:flex;flex-direction:column;gap:7px}
  .ask .opt{display:block;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);min-width:0;overflow-wrap:anywhere}
  .ask .opt b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;white-space:normal;line-height:1.35}
  .ask .opt span{display:block;font-size:12px;line-height:1.45;color:var(--text-2);margin-top:3px}
  .ask .opt span:empty{display:none}
  .ask .opt.rec{border-color:var(--good);background:rgba(47,211,106,.08)}
  .ask .opt.rec b{color:var(--good)}
  .ask .where{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);font-size:12px;line-height:1.45;color:var(--text-2)}
  .ask .where b{color:var(--text)}
  .ask .where .w{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px;animation:pingW 1.4s ease-out infinite}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px -16px var(--shadow)}
  .card h3{margin:0 0 10px;font-size:13px;font-weight:650;display:flex;align-items:center;justify-content:space-between}
  .card h3 span.sub{color:var(--text-3);font-weight:500;font-size:12px}
  .agent{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--border);opacity:0;animation:in .5s ease forwards;animation-delay:var(--d)}
  .agent:first-of-type{border-top:0}
  .av{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;position:relative}
  .av.main{background:var(--main)}.av.reas{background:var(--reasoning)}.av.light{background:var(--light)}
  .av.main::after,.av.reas::after{content:"";position:absolute;inset:0;border-radius:10px;animation:ringA 2s ease-out infinite}
  .av.reas::after{animation-delay:.7s;animation-name:ringB}
  @keyframes ringA{0%{box-shadow:0 0 0 0 rgba(42,120,214,.5)}100%{box-shadow:0 0 0 10px rgba(42,120,214,0)}}
  @keyframes ringB{0%{box-shadow:0 0 0 0 rgba(74,58,167,.5)}100%{box-shadow:0 0 0 10px rgba(74,58,167,0)}}
  .av .live{position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);background:var(--good)}
  .av .live.idle{background:var(--text-3)}
  .agent .n{font-weight:600;font-size:13px}
  .agent .d{color:var(--text-2);font-size:12px}
  .agent .r{text-align:right;font-size:12px;color:var(--text-2)}
  .agent .r b{display:block;color:var(--text);font-size:13px;font-variant-numeric:tabular-nums}
  .chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);margin-left:6px}
  .chip.on{background:var(--on-bg);color:var(--on-t);border-color:var(--on-bg)}
  .chip.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px;animation:breathe 1.2s ease-in-out infinite}
  .typing::after{content:"";display:inline-block;width:7px;height:12px;background:var(--main);vertical-align:-2px;margin-left:2px;animation:caret 1s steps(1) infinite}
  @keyframes caret{50%{opacity:0}}

  .tb{display:grid;grid-template-columns:110px 1fr 86px;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}
  .tb .lbl{color:var(--text-2);display:flex;align-items:center;gap:7px}
  .tb .lbl i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .tb .bar{height:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;overflow:hidden}
  .tb .bar div{height:100%;border-radius:5px;width:0;animation:xp 1.6s cubic-bezier(.3,.8,.2,1) forwards;animation-delay:1.6s;position:relative;overflow:hidden}
  .tb .bar div::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shimmer 2.6s linear infinite}
  @keyframes xp{to{width:var(--w)}}
  .tb .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
  .tb .num small{color:var(--text-3);margin-left:3px}
  .split{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
  .split b{color:var(--text);font-variant-numeric:tabular-nums}
  /* donut */
  .donut{display:flex;align-items:center;gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
  .donut svg{flex:0 0 64px}
  .donut circle{fill:none;stroke-width:9;transform:rotate(-90deg);transform-origin:center;stroke-dasharray:0 200;animation:arc 1.8s cubic-bezier(.3,.8,.2,1) 1.8s forwards}
  @keyframes arc{to{stroke-dasharray:var(--a) 200}}
  .donut .lg{font-size:11.5px;color:var(--text-2);line-height:1.5}
  .donut .lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

  .gate li{list-style:none;display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:12.5px;color:var(--text-2);opacity:0;transform:translateX(-8px);animation:slide .45s ease forwards;animation-delay:calc(1.4s + var(--i)*.1s)}
  .gate ul{margin:0;padding:0}
  .gate .ck{width:16px;height:16px;border-radius:4px;flex:0 0 16px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;margin-top:1px}
  .ck.y{background:var(--good)}.ck.n{background:var(--surface-2);border:1px solid var(--border);color:var(--text-3)}.ck.w{background:var(--warning);color:#3a2a00;animation:wob 1.4s ease-in-out infinite}
  @keyframes wob{0%,100%{transform:rotate(0)}30%{transform:rotate(-12deg)}60%{transform:rotate(10deg)}}
  .wait{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--wait-bg);border:1px solid var(--wait-b);font-size:12.5px;opacity:0;animation:in .6s cubic-bezier(.2,.8,.2,1) 2.4s forwards, waitGlow 2.4s ease-in-out 3s infinite}
  @keyframes waitGlow{0%,100%{box-shadow:0 0 0 0 rgba(250,178,25,0)}50%{box-shadow:0 0 0 6px rgba(250,178,25,.18)}}
  .wait b{display:block;font-size:12px;margin-bottom:2px;color:var(--wait-h)}
  .wait .where b{color:var(--wait-h)}
  .wait .btns{display:flex;gap:6px;margin-top:8px}
  .wait .b{padding:5px 10px;border-radius:7px;font-size:11.5px;font-weight:600;background:var(--btn);color:var(--btn-t)}
  .wait .b.o{background:transparent;border:1px solid var(--text);color:var(--text)}
  .wait .where{margin-top:10px;padding-top:8px;border-top:1px dashed var(--wait-rule);font-size:12px;line-height:1.45;color:var(--wait-t)}
  .wait .where b{display:inline;color:var(--text);margin:0}
  .wait .where .w{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e08a00;margin-right:6px;animation:pingW 1.4s ease-out infinite}
  @keyframes pingW{0%{box-shadow:0 0 0 0 rgba(224,138,0,.5)}100%{box-shadow:0 0 0 8px rgba(224,138,0,0)}}

  /* live feed */
  .feed{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 14px;margin-top:12px;font-size:12.5px;color:var(--text-2);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .feed .lab{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text-3);flex:0 0 auto}
  .feed .track{flex:1;overflow:hidden;position:relative;height:20px;mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);-webkit-mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
  .feed .items{position:absolute;white-space:nowrap;display:flex;gap:36px;animation:ticker 40s linear infinite}
  @keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .feed .items span b{color:var(--text)}
  .feed .items span i{font-style:normal;color:var(--text-3);margin-right:6px;font-variant-numeric:tabular-nums}
  footer{display:flex;justify-content:space-between;color:var(--text-3);font-size:11.5px;margin-top:12px}
  /* toast */
  .toast{position:fixed;left:50%;top:100px;z-index:5;transform:translate(-50%,-30px);opacity:0;background:var(--toast);border:1px solid var(--border);color:#fff;padding:9px 16px;border-radius:999px;font-size:12.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:toast 7s ease 4.5s infinite}
  .toast b{color:#ffd36b}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-30px)}6%,50%{opacity:1;transform:translate(-50%,0)}58%,100%{opacity:0;transform:translate(-50%,-30px)}}

  /* ================= CONCEPT 06 · OnlyBCFans brand skin ================= */
  :root, :root[data-theme="dark"]{color-scheme:dark;
    --bg:#1c1c1c; --surface:#242424; --surface-2:#2c2c2c; --border:#3a3a3a; --card:#222; --ink-on-brand:#1c1c1c; --node-done:#fff; --node-done-t:#1c1c1c;
    --text:#f4f4f2; --text-2:#b9b9b4; --text-3:#7e7e78;
    --b-blue:#1a6fd0; --b-teal:#0e8a84; --b-violet:#7a4fc9; --b-magenta:#c81d7a; --b-green:#2fd36a; --b-orange:#f5a21b;
    --main:#3b8ee6; --reasoning:#9a6fe8; --light:#19b3a6; --seq-500:#1a6fd0; --seq-650:#7a4fc9;
    --good:#2fd36a; --warning:#f5a21b; --critical:#e0407a; --track:#3a3a3a;
    --fw:#f5a21b; --wait-bg:rgba(245,162,27,.08); --wait-b:rgba(245,162,27,.45); --wait-t:#e9c98a; --wait-h:#ffd98a; --wait-rule:rgba(245,162,27,.3);
    --on-bg:rgba(47,211,106,.12); --on-t:#7ff0a8; --toast:#101010; --shadow:rgba(0,0,0,.6);
    --a1:transparent; --a2:transparent; --a3:transparent; --aurora-op:0;
    --donut-t:#f4f4f2; --wait-amber:#f5a21b; --btn:#f4f4f2; --btn-t:#1c1c1c;
  }

  :root[data-theme="light"]{color-scheme:light;
    --bg:#f4f3ef; --surface:#ffffff; --surface-2:#eceae4; --border:#dcd9d1; --card:#ffffff; --ink-on-brand:#fff; --node-done:#1c1c1c; --node-done-t:#fff;
    --text:#1c1c1c; --text-2:#55544f; --text-3:#8a8882;
    --main:#1a6fd0; --reasoning:#7a4fc9; --light:#0e8a84; --seq-500:#1a6fd0; --seq-650:#7a4fc9;
    --good:#13a04a; --warning:#d98a00; --critical:#c81d7a; --track:#dcd9d1;
    --wait-bg:rgba(19,160,74,.06); --wait-b:#13a04a; --wait-t:#55544f; --wait-h:#1c1c1c;
    --on-bg:rgba(19,160,74,.12); --on-t:#0d7a37; --toast:#1c1c1c; --shadow:rgba(0,0,0,.08);
    --donut-t:#1c1c1c; --wait-amber:#b36f00; --btn:#1c1c1c; --btn-t:#fff;
  }
  :root[data-theme="light"] body{background:var(--bg)}
  :root[data-theme="light"] .tile,:root[data-theme="light"] .panel,:root[data-theme="light"] .card{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  :root[data-theme="light"] .wordmark{color:#1c1c1c}:root[data-theme="light"] .wordmark .fans{color:#3a3a3a}:root[data-theme="light"] .wordmark .bc{color:#1c1c1c}
  :root[data-theme="light"] .brand h1,:root[data-theme="light"] .tile .v,:root[data-theme="light"] .agent .n,:root[data-theme="light"] .split b,:root[data-theme="light"] .tb .num,:root[data-theme="light"] .st.now .nm,:root[data-theme="light"] .st.now .id{color:#1c1c1c}
  :root[data-theme="light"] .hright .pill:first-child{color:#1c1c1c}
  :root[data-theme="light"] .phase.now{box-shadow:0 0 0 2px #1c1c1c inset}
  :root[data-theme="light"] .phase{opacity:.5}:root[data-theme="light"] .phase.done,:root[data-theme="light"] .phase.now{opacity:1}
  :root[data-theme="light"] .st .node{background:#fff;border-color:#cfccc4}
  :root[data-theme="light"] .st.done .node{background:#1c1c1c;border-color:#1c1c1c;color:#fff}
  :root[data-theme="light"] .st.now .node{background:#fff;border-color:#1c1c1c;color:#1c1c1c;box-shadow:0 0 0 4px rgba(0,0,0,.08)}
  :root[data-theme="light"] .comet{background:#fff;border-color:#1c1c1c;box-shadow:0 0 0 4px rgba(0,0,0,.08)}
  :root[data-theme="light"] .comet::before{background:linear-gradient(90deg,transparent,rgba(26,111,208,.6))}
  :root[data-theme="light"] .pulse{border-color:#1c1c1c}
  :root[data-theme="light"] .spur{background:#cfccc4}
  :root[data-theme="light"] .wait b,:root[data-theme="light"] .wait .where b{color:#1c1c1c}
  :root[data-theme="light"] .wait .b{background:#1c1c1c;color:#fff}:root[data-theme="light"] .wait .b.o{border-color:#1c1c1c;color:#1c1c1c;background:transparent}
  :root[data-theme="light"] .ask{box-shadow:0 0 0 2px rgba(19,160,74,.12)}
  :root[data-theme="light"] .ask .opt.rec{background:rgba(19,160,74,.08)}
  :root[data-theme="light"] .ck.y{color:#fff}:root[data-theme="light"] .ck.n{background:#eceae4;border-color:#dcd9d1}
  :root[data-theme="light"] .feed .items span b,:root[data-theme="light"] .toast{color:#fff}
  :root[data-theme="light"] .toast{background:#1c1c1c;border-color:#1c1c1c}
  :root[data-theme="light"] .feed .items span b{color:#1c1c1c}
  :root[data-theme="light"] .est .head{background:#fff;border-color:#1c1c1c}:root[data-theme="light"] .est .mark{background:#1c1c1c}
  .pill.theme{display:inline-flex;cursor:pointer}
  /* ---------- tool switch: body.copilot = GitHub Copilot Chat project (AI credits) ---------- */
  body.copilot .cc-only{display:none!important}
  body:not(.copilot) .gh-only{display:none!important}
  body.copilot .hright .pill:first-child{border-color:var(--border);color:var(--text-2);box-shadow:none}
  body.copilot .hright .pill:first-child .dot{background:var(--text-3);animation:none}
  body.copilot .tile.time .tbar,body.copilot .tile.time .tleg{display:none}
  body.copilot .tile.time .na{display:block;font-size:11.5px;color:var(--text-3);margin-top:6px;line-height:1.35}
  .tile.time .na{display:none}
  body.copilot .spark path.l{stroke:var(--b-orange)}
  .rolechip{display:inline-block;padding:1px 5px;flex:0 0 auto;border-radius:999px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);margin-left:6px;vertical-align:1px}
  .cr{display:grid;grid-template-columns:minmax(0,1fr) 96px 54px;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}
  .cr .lbl{display:flex;align-items:center;gap:7px;color:var(--text-2);white-space:nowrap;overflow:visible}
  .cr .lbl i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:0 0 9px}
  .cr .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
  .cr .n small{color:var(--text-3);margin-left:3px}
  .cr .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;grid-column:1/-1;margin-top:-4px}
  .cr .bar div{height:100%;border-radius:4px;width:0;animation:xp 1.6s cubic-bezier(.3,.8,.2,1) 1.6s forwards}
  body{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg)}
  .aurora{display:none}
  .wrap{width:1400px;padding:28px 20px 20px}
  .tile,.panel,.card,.feed,.spurchip{border-radius:14px;box-shadow:none;border:1px solid var(--border)}
  .tile,.panel,.card{background:var(--card)}
  .pill{background:transparent;color:var(--text-2);letter-spacing:.06em;text-transform:uppercase;font-size:11px;font-weight:700}
  .pill b{letter-spacing:0}
  /* header: wordmark + tracked title like the social cards */
  header{align-items:flex-end;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border)}
  .brand .logo{width:44px;height:44px}
  .brand .fw{display:none}
  .wordmark{display:block;margin:0 0 10px -6px;height:48px}
  .wordmark .lg{height:48px;width:auto;display:none}
  :root[data-theme="dark"] .wordmark .lg.night{display:block}
  :root[data-theme="light"] .wordmark .lg.day{display:block}
  .wordmark .bc{background:var(--b-orange);color:#1c1c1c;padding:0 7px;border-radius:7px;line-height:1.2}
  .wordmark .fans{font-weight:500;color:#e4e4e0}
  .brand h1{font-family:Archivo,Inter,sans-serif;font-stretch:112%;font-weight:900;font-size:30px;white-space:nowrap;letter-spacing:-.02em;line-height:1;color:#fff;margin:0}
  .brand h1 span{font-family:Inter;font-stretch:100%;font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)!important;margin-left:10px;vertical-align:middle}
  .brand .sub{margin-top:8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);font-weight:700}
  .accentbar{height:6px;width:340px;margin-top:10px;border-radius:3px;overflow:hidden;background:linear-gradient(90deg,var(--b-blue) 0 25%,var(--b-teal) 25% 50%,var(--b-violet) 50% 75%,var(--b-magenta) 75%)}
  .hright{align-self:stretch;justify-content:space-between;margin-top:6px;gap:10px}
  .pillrow{gap:6px;flex-wrap:nowrap}
  .hright .pill{white-space:nowrap;padding:5px 8px;font-size:9.5px;letter-spacing:.05em}
  .hright .pill .tool-ic{width:16px;height:16px}
  .hright .pill:first-child{border-color:var(--b-green);color:#fff;box-shadow:0 0 0 2px rgba(47,211,106,.18),0 0 18px rgba(47,211,106,.25)}
  /* tiles: label tracked, number heavy */
  .tile .k{font-size:10px;letter-spacing:.18em;color:var(--text-3);font-weight:700;margin-bottom:6px}
  .tile .v{font-family:Archivo,Inter,sans-serif;font-stretch:112%;font-weight:900;font-size:28px;letter-spacing:-.02em;color:#fff}
  .tile .v small{font-family:Inter;font-weight:500;color:var(--text-2)}
  .tile .m{color:var(--text-2)}
  .tiles{gap:10px;margin-bottom:12px;grid-template-columns:1.05fr 1fr 1.45fr .9fr 1.55fr}
  .tile .m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .est .k{white-space:nowrap}
  .tile.time .tbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);margin:8px 0 6px}
  .tile.time .tbar i{display:block;height:100%;width:0;animation:xp 1.6s cubic-bezier(.3,.8,.2,1) 1.2s forwards}
  .tile.time .ag{background:var(--main)}.tile.time .hu{background:var(--b-teal)}.tile.time .wa{background:var(--b-orange)}
  .tile.time .tleg{display:flex;gap:12px;font-size:11px;color:var(--text-2);white-space:nowrap}
  .tile.time .tleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}

  .est .bar{height:8px;border-radius:4px;background:#2c2c2c;border:0}

  .est .head{border-color:#fff;background:#1c1c1c}
  .est .mark{background:#fff}
  .spark path.l{stroke:var(--b-teal)}
  /* journey: phase colour blocks */
  .panel h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}
  .panel h2 .sub{letter-spacing:.08em;font-size:11px}
  .panel .hint{display:none}
  .phases{gap:8px;margin:14px 0 10px}
  .phase{position:relative;height:64px;padding:11px 14px 10px;border:0;margin:0;color:#fff;opacity:.42;overflow:hidden;border-radius:10px;display:flex;flex-direction:column;justify-content:space-between;font-family:Inter,sans-serif;transition:opacity .4s}
  .phase::after{display:none}
  .phase .num{font-family:Archivo,Inter,sans-serif;font-stretch:112%;font-weight:900;font-size:24px;line-height:1;letter-spacing:-.02em}
  .phase .nm{position:absolute;left:14px;top:14px;margin-left:34px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;line-height:1.1;opacity:.95}
  .phase .num + .nm{margin-left:0;left:auto;right:14px;top:13px;text-align:right}
  .phase .sub{font-size:11.5px;font-weight:500;letter-spacing:.01em;line-height:1.2;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .phase .sub b{font-weight:700;opacity:1}
  .phase .pct{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.22)}
  .phase .pct i{display:block;height:100%;width:var(--p,0%);background:#fff;opacity:.9;transition:width 1.2s ease 1.6s}
  .phase:nth-child(1){background:var(--b-blue)}.phase:nth-child(2){background:var(--b-teal)}.phase:nth-child(3){background:var(--b-violet)}.phase:nth-child(4){background:var(--b-magenta)}
  .phase.done{opacity:1}.phase.now{opacity:1;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.9) inset;animation:none}
  .phase.now::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:shimmer 2.4s linear infinite}
  .line{height:200px;margin-top:10px}
  .rail{background:var(--track);height:4px;top:21px;border-radius:2px}
  .rail .prog{border-radius:2px;background:linear-gradient(90deg,var(--b-blue),var(--b-teal),var(--b-violet));box-shadow:none}
  .comet{border-color:#fff;background:#1c1c1c;box-shadow:0 0 0 4px rgba(255,255,255,.12)}
  .comet::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.6))}
  .pulse{border-color:#fff}
  .st .node{border-radius:7px;border-width:2px;background:#1c1c1c;border-color:#444;color:var(--text-2)}
  .st.done .node{background:#fff;border-color:#fff;color:#1c1c1c}

  .av .live{border-color:#222}
  .agent .n{color:#fff}
  .chip{border-radius:999px;letter-spacing:.06em;text-transform:uppercase;font-size:10px}
  .tb .bar{border-radius:4px;border:0;background:var(--surface-2);height:8px}
  .tb .bar div{border-radius:4px}
  .tb .lbl i{border-radius:2px}
  .split b,.tb .num{color:#fff}
  .donut .lg i{border-radius:2px}
  .gate .ck{border-radius:5px}
  .ck.y{background:var(--b-green);color:#1c1c1c}
  .ck.n{background:#2c2c2c;border-color:#3a3a3a}
  .ck.w{background:var(--b-orange)}
  .wait{border-radius:12px;border-color:var(--b-green);background:rgba(47,211,106,.06);box-shadow:0 0 0 2px rgba(47,211,106,.15),0 0 20px rgba(47,211,106,.18);animation:in .6s cubic-bezier(.2,.8,.2,1) 2.4s forwards}
  .wait b{color:#fff;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px}
  .wait .where b{letter-spacing:0;text-transform:none;font-size:inherit;color:#fff}

  .wait .b{border-radius:8px;background:#fff;color:#1c1c1c;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px;font-weight:800}
  .wait .b.o{background:transparent;border:1px solid #fff;color:#fff}
  /* feed + footer */
  .feed{background:transparent;border:0;border-top:1px solid var(--border);border-radius:0;padding:12px 0 0;margin-top:14px}
  .feed .lab{color:var(--b-green);letter-spacing:.16em}
  .feed .items span b{color:#fff}
  footer{border-top:1px solid var(--border);padding-top:14px;margin-top:14px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);font-weight:700}
  footer span:last-child{color:var(--text-2)}
  footer .demo button{font:inherit;letter-spacing:inherit;text-transform:inherit;background:transparent;border:1px solid var(--border);border-radius:999px;padding:2px 9px;color:var(--text-2);cursor:pointer}
  footer .demo button:hover{border-color:var(--main)}
  footer{justify-content:space-between;gap:16px}
  .toast{border-radius:999px;border-color:#3a3a3a;letter-spacing:.02em;top:auto;bottom:104px}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,30px)}6%,50%{opacity:1;transform:translate(-50%,0)}58%,100%{opacity:0;transform:translate(-50%,30px)}}
  .toast b{color:var(--b-orange)}
  /* repaint in place: entrance animations play once, later data pulls only swap content */
  body.painted .in,body.painted .agent{animation:none;opacity:1;transform:none}
  body.painted .ask{animation:waitGlow 2.6s ease-in-out infinite}
  body.painted .wait{opacity:1;animation:waitGlow 2.4s ease-in-out infinite}
  body.painted .spur{animation:none;transform:scaleY(1)}
  body.painted .spark path.l{animation:none;stroke-dashoffset:0}
  body.painted .tb .bar div{animation:none;width:var(--w)}
  .next{color:var(--text-3);font-weight:500;letter-spacing:0;text-transform:none}
  body.updated #livePill{animation:pulse .9s ease-out 1}
</style>

  .gate .txt{font-size:12.5px;line-height:1.4}
  .empty{color:var(--text-3);font-size:12px;padding:6px 0}

  .ask .opt.rec b{color:var(--good)}
  .note-line{font-size:11px;color:var(--text-3);margin-top:8px;line-height:1.4}
  .stale{border-color:var(--b-orange)!important;color:var(--b-orange)!important}
  .fresh{position:fixed;right:18px;bottom:16px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}

  footer .fx{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  footer select{font:inherit;letter-spacing:inherit;text-transform:inherit;background:transparent;border:1px solid var(--border);border-radius:999px;padding:2px 9px;color:var(--text-2)}
  .toast{animation:none;opacity:0}
  .toast.show{animation:toastIn .5s ease forwards}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translate(-50%,0)}}

  .grid .card{min-width:0}
  .st .nm{font-size:11px}
</style>

if(est&&est.estimated){const pct=Math.min(100,Math.round(100*est.used/est.estimated));const ok=pct<=100?(pct<=90?['✓ On track','var(--good)']:['Near estimate','var(--warning)']):['Over estimate','var(--critical)'];
  estHtml=`<div class="k" style="display:flex;justify-content:space-between;align-items:center"><span>Step ${esc(cur.id||'')} vs AI Effort Estimate</span><span class="status"><span class="sw" style="background:${ok[1]}"></span>${ok[0]}</span></div><div class="bar"><div class="fill" style="animation:none;width:${pct}%"></div><div class="head" style="animation:none;left:${pct}%"></div><div class="mark"></div></div><div class="legend"><span>${copilot?fmtN(est.used)+' of '+fmtN(est.estimated)+' credits estimated':fmtTok(est.used)+' used of '+fmtTok(est.estimated)+' estimated'}</span><span>${pct}%</span></div>`;}
else estHtml=`<div class="k">Step ${esc(cur.id||'')} vs AI Effort Estimate</div><div class="v" style="font-size:16px;margin-top:8px;color:var(--text-2)">${est&&est.note?esc(est.note):'No estimate yet'}</div><div class="m">${fw.edition==='lite'?'written at Step 2':'written at Step 03'} · docs/2-design/AiEffortEstimate.md</div>`;
tiles.push(`<div class="tile est in" style="--d:.5s">${estHtml}</div>`);
$('tiles').innerHTML=tiles.join('');

// ---- journey ----
const steps=D.steps||[];const PH=['DEFINE','DESIGN','BUILD','PROVE'];
const byPh=PH.map((p,i)=>{const ss=steps.filter(s=>s.phase===p);const done=ss.filter(s=>s.status==='done').length;const now=ss.find(s=>s.status==='now');
  const el=ss.reduce((a,s)=>a+(s.elapsedSeconds||0),0),cost=ss.reduce((a,s)=>a+(s.costUsd||0),0);
  const st=done===ss.length&&ss.length?'done':now||done?'now':'';
  const sub=st==='done'?`<b>${done} of ${ss.length}</b> · ${hm(el)} · ${usd(cost)}`:now?`<b>Step ${ss.indexOf(now)+1} of ${ss.length}</b> · ${hm(el)} · ${usd(cost)}`:done?`<b>${done} of ${ss.length}</b> done · ${hm(el)} · ${usd(cost)}`:`<b>${ss.length} step${ss.length>1?'s':''}</b> ahead`;
  const pct=ss.length?Math.round(100*(done+(now?0.5:0))/ss.length):0;
  return {p,ss,st,html:`<div class="phase ${st}"><span class="num">0${i+1}</span><span class="nm">${p[0]+p.slice(1).toLowerCase()}</span><span class="sub">${sub}</span><span class="pct"><i style="--p:${pct}%"></i></span></div>`};});
$('phases').style.gridTemplateColumns=byPh.map(x=>Math.max(1,x.ss.length)+'fr').join(' ');
$('phases').innerHTML=byPh.map(x=>x.html).join('');
const n=steps.length,doneN=steps.filter(s=>s.status==='done').length,nowI=steps.findIndex(s=>s.status==='now');
$('journeySub').textContent=`${n} stations · ${doneN} reached · ${nowI>=0?'1 in progress':'none in progress'}`;
(function(){const line=$('line');const W=line.clientWidth||1360;const pad=40;const gap=n>1?(W-2*pad)/(n-1):0;const progPct=n>1?((nowI>=0?nowI:doneN-0.5)/(n-1))*100:0;
  let h=`<div class="rail"><div class="prog" style="animation:none;width:${Math.max(0,progPct)}%"></div>${nowI>=0?`<div class="comet" style="animation:none;left:${progPct}%"></div><div class="pulse" style="left:${progPct}%"></div>`:''}</div>`;
  steps.forEach((s,i)=>{const x=pad+i*gap;const meta=s.status==='done'?`${hm(s.elapsedSeconds)} · ${usd(s.costUsd)}`:s.status==='now'?`${hm(s.elapsedSeconds)} · ${usd(s.costUsd)}${s.note?' · '+esc(s.note):''}`:'';
    const idTxt=s.status==='now'?'IN PROGRESS':s.id;const node=s.status==='done'?'':esc(s.id.replace('PRE-','P'));
    h+=`<div class="st ${s.status}" style="left:${x}px;--d:${(0.3+i*0.12).toFixed(2)}s;width:${Math.min(110,Math.max(70,gap-6))}px;margin-left:-${Math.min(55,Math.max(35,(gap-6)/2))}px"><div class="node">${node}</div><div class="id">${idTxt}</div><div class="nm">${esc(s.short||s.title)}</div><div class="meta">${meta}</div></div>`;});
  // sub-agent spurs under the current station
  const subs=(D.roles||[]).filter(r=>r.role!=='Main'&&r.role!=='Generator'&&(r.status==='running'||r.lastDetail));
  line.style.setProperty('--lineH',(nowI>=0&&subs.length?200:120)+'px');
  if(nowI>=0&&subs.length){const x=pad+nowI*gap;subs.slice(0,2).forEach((r,k)=>{const cls=r.role==='Reasoning'?'r':'l';const top=112+k*44;
    h+=`<div class="spur ${cls}" style="left:${x-1}px;top:112px;height:${top-112+14}px;--d:3s"></div><div class="spurchip ${cls}" style="left:${x+10}px;top:${top+6}px;--d:3.1s;${r.status==='running'?'':'--o:.65'}"><span class="sc-av" style="background:var(--${cls==='r'?'reasoning':'light'})">${r.role[0]}${r.status==='running'?'<span class="spin"></span>':''}</span><span><b>${esc(r.role)}</b> · ${esc(r.model||'')}<br>${esc(r.status==='running'?('running · '+hm(r.runningSeconds)):(r.lastDetail||'idle'))}</span></div>`;});}
  line.innerHTML=h;})();

// ---- waiting on you ----
const WHERE={'claude-code':'Reply in <b>Visual Studio Code</b> (the Claude Code panel or terminal) or on your <b>mobile device</b> via Claude Code Remote Control. This page only shows the question.','copilot-chat':'Reply in <b>Visual Studio Code</b> (GitHub Copilot Chat). This page only shows the question.','copilot-cli':'Reply in the <b>Copilot CLI</b> terminal. This page only shows the question.'};
$('grid').classList.toggle('asking',!!waiting);if(!waiting)$('askCard').innerHTML='';if(waiting){const since=waiting.since?new Date(waiting.since):null;
  $('askCard').innerHTML=`<h3>Waiting on you <span class="sub">${since?'since '+since.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}</span></h3><div class="q">${esc(waiting.question||'A question or approval is open.')}</div><div class="opts">${(waiting.options||[]).map((o,i)=>`<div class="opt ${o.recommended||/recommended/i.test(o.label||'')?'rec':''}"><b>${esc(o.label)}</b><span>${esc(o.description||'')}</span></div>`).join('')}</div><div class="where"><span class="w"></span><b>Waiting on your answer${since?' since '+since.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}.</b> ${WHERE[D.tool]||WHERE['claude-code']}</div>`;}

// ---- roles ----
const RC={Main:'main',Reasoning:'reas',Light:'light',Generator:''};
$('roles').innerHTML=(D.roles||[]).map((r,i)=>{const cls=RC[r.role]||'';const st=r.status||'idle';const chip=st==='working'||st==='running'?`<span class="chip on">${st}${r.runningSeconds?' '+hm(r.runningSeconds):''}</span>`:`<span class="chip">${esc(st)}</span>`;
  const right=copilot?`<b>${r.credits!=null?fmtN(r.credits)+' cr':'—'}</b>${r.stepCredits!=null?'this step '+fmtN(r.stepCredits):''}`:`<b>${r.tokens!=null?fmtTok(r.tokens):'—'}</b>${r.stepTokens!=null?'this step '+fmtTok(r.stepTokens):''}`;
  return `<div class="agent" style="--d:${1.2+i*0.2}s${st==='not started'?';opacity:.6':''}"><div class="av ${cls}" ${cls?'':'style="background:var(--text-3)"'}>${esc(r.role[0])}${cls?`<span class="live ${st==='working'||st==='running'?'':'idle'}"></span>`:''}</div><div><div class="n">${esc(r.role)}${r.role!=='Main'&&r.role!=='Generator'?' sub-agent':''} ${chip}</div><div class="d">${esc([r.model,r.effort?'effort '+r.effort:null,r.detail].filter(Boolean).join(' · '))}${st==='working'?'<span class="typing"></span>':''}</div></div><div class="r">${right}</div></div>`;}).join('')||'<div class="empty">No role assignment recorded yet (asked at PRE-01 / Step 1).</div>';

// ---- models ----
const M=D.models||[];const mx=Math.max(1,...M.map(m=>copilot?(m.credits||0):(m.tokens||0)));const col=['var(--main)','var(--reasoning)','var(--light)','var(--b-magenta)','var(--b-orange)'];
let mh=`<h3>${copilot?'AI credits by model':'Tokens by model'} <span class="sub">${copilot?(D.pricing&&D.pricing.usdPerCredit!=null?'1 credit = $'+D.pricing.usdPerCredit:'cumulative'):'cumulative, all steps'}</span></h3>`;
if(!M.length)mh+='<div class="empty">Nothing measured yet. Rows appear after the first step close.</div>';
M.forEach((m,i)=>{const v=copilot?(m.credits||0):(m.tokens||0);mh+=`<div class="tb"><div class="lbl"><i style="background:${col[i%col.length]}"></i>${esc(m.model)}${m.role&&m.role!=='session'?`<span class="rolechip">${esc(m.role)}</span>`:''}</div><div class="bar"><div style="--w:${Math.round(100*v/mx)}%;background:${col[i%col.length]}"></div></div><div class="num">${copilot?fmtN(v):fmtTok(v)}<small>${usd(m.costUsd)}</small></div></div>`;});
if(!copilot&&T.tokens){const tk=T.tokens;mh+=`<div class="split"><span>Input <b>${fmtTok(tk.input)}</b></span><span>Output <b>${fmtTok(tk.output)}</b></span><span>Cache write <b>${fmtTok(tk.cacheWrite)}</b></span><span>Cache read <b>${fmtTok(tk.cacheRead)}</b></span></div>`;}
if(D.pricing&&D.pricing.source)mh+=`<div class="note-line">Prices: ${esc(D.pricing.source)}${D.pricing.fetchedAt?' · fetched '+esc(D.pricing.fetchedAt):''}</div>`;
$('modelsCard').innerHTML=mh;

// ---- exit gate ----
const g=cur.exitGate||[];
$('gateCard').innerHTML=`<h3>${cur.id?'Step '+esc(cur.id)+' exit gate':'Exit gate'} <span class="sub">${cur.id?'from runbookSteps/'+esc(cur.id)+'.md':''}</span></h3>${g.length?'<ul>'+g.map((t,i)=>`<li style="--i:${i}"><span class="ck n">·</span><span class="txt">${esc(t)}</span></li>`).join('')+'</ul>':'<div class="empty">No step in progress.</div>'}<div class="note-line">The gate is met when the agent says so in the closing message; this list is the step file's wording.</div>`;

// ---- feed ----
const ev=D.events||[];const fh=ev.map(e=>`<span><i>${esc(e.time)}</i><b>${esc(e.who)}</b> ${esc(e.text)}</span>`).join('')||'<span><i>—</i>No events yet</span>';
$('feed').innerHTML=fh+fh;

$('foot').textContent=`ProjectDashboard.html · rendered by ${D.renderer||'ocpf-dashboard'} · ${D.refreshSeconds?'data refreshes in place every '+D.refreshSeconds+' s':''}`;
}

// ---- first paint, freshness, in-place refresh ----
paint(D);
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('painted')));  // entrance animations play once; repaints are silent
let nextAt=Date.now()+(D.refreshSeconds||30)*1000,pulling=false;
function fresh(){if(!gen)return;const age=Math.round((Date.now()-gen.getTime())/1000);$('fresh').textContent=`rendered ${age<90?age+' s':Math.round(age/60)+' min'} ago`;$('livePill').classList.toggle('stale',age>900);}
function tick(){const n=$('next');if(n){const left=Math.max(0,Math.ceil((nextAt-Date.now())/1000));n.textContent=pulling?'updating…':`next in ${left} s`;}if(!pulling&&Date.now()>=nextAt)pull();}
// Pull the renderer's sidecar (ocpfFramework/state/dashboard-data.js) through a <script> tag — the one load that works
// on file:// in every browser — and repaint only when the data changed. No sidecar (older renderer): fall back to a reload.
function pull(){if(!D.refreshSeconds)return;pulling=true;tick();const sc=document.createElement('script');sc.src=(D.dataUrl||'ocpfFramework/state/dashboard-data.js')+'?t='+Date.now();
  sc.onload=()=>{sc.remove();const n=window.__ocpfData;window.__ocpfData=null;if(n&&n.generatedAt&&n.generatedAt!==D.generatedAt){D=n;paint(D);fresh();document.body.classList.remove('updated');void document.body.offsetWidth;document.body.classList.add('updated');}done();};
  sc.onerror=()=>{sc.remove();if(!D.dataUrl){location.reload();return;}done();};
  function done(){pulling=false;nextAt=Date.now()+(D.refreshSeconds||30)*1000;tick();}
  document.head.appendChild(sc);}
fresh();tick();setInterval(fresh,15000);setInterval(tick,1000);
if(D.toast){const t=$('toast');t.innerHTML=esc(D.toast);t.classList.add('show');}
})();

</script>
</body>
</html>
