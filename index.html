<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f3f2f2; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont,sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #f3f2f2; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
</head>
<body>
  <div id="__bundler_thumbnail">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#f3f2f2"></rect>
    <rect x="360" y="240" width="120" height="320" fill="#0F6CBD"></rect>
    <rect x="500" y="240" width="120" height="320" fill="#0A7C85"></rect>
    <rect x="640" y="240" width="120" height="320" fill="#6B4FC4"></rect>
    <rect x="780" y="240" width="120" height="320" fill="#C10E72"></rect>
  </svg>
</div>
  <div id="__bundler_loading">Unpacking...</div>
  <script>document.getElementById('__bundler_loading').textContent='This placeholder was committed. Replace with the full bundled HTML content.';</script>
</body>
</html>
