  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

splay:flex;flex-direction:column;justify-content:space-between\">\n  <div style=\"display:flex;gap:0;height:10px\">\n    <div style=\"flex:1;background:#0F6CBD\"><\u002Fdiv><div style=\"flex:1;background:#0A7C85\"><\u002Fdiv><div style=\"flex:1;background:#6B4FC4\"><\u002Fdiv><div style=\"flex:1;background:#C10E72\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div>\n    <img src=\"b17c3f69-1dc0-4e0d-9d22-5f84f1ea2698\" alt=\"OnlyCopilotFans\" style=\"width:440px;height:auto;display:block;margin-bottom:56px\">\n    <h1 style=\"font-size: 90px; font-weight: 800; line-height: 0.95; letter-spacing: -0.03em; margin: 0 0 40px\">Business Central <br>Agentic Development Framework<\u002Fh1>\n    <div style=\"height:2px;background:#201e1d;margin-bottom:40px\"><\u002Fdiv>\n    <p style=\"font-size:38px;font-weight:600;line-height:1.25;margin:0\">Simple Enough for Functional Consultants. <br>Robust Enough for Pro Developers.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:10px\">\n    <div style=\"font-size:30px;font-weight:600\">Created by AJ Ansari, Microsoft MVP<\u002Fdiv>\n    <div style=\"font-size:24px;font-weight:500;color:#444141\"><a href=\"https://github.com/ajansari/ocpfBcAgenticDevFramework\">https://github.com/ajansari/ocpfBcAgenticDevFramework<\u002Fa><\u002Fdiv>\n    <div style=\"font-size:21px;font-weight:500;line-height:1.35;color:#605d5d\">Full runbook v3.3.0.0 · Lite v2.2.0.0 · AL Development Standards Guide v1.9.0.0 · Operations Guide v1.2.0.0 · <code style=\"font-family:inherit\">ocpf-bc<\u002Fcode> plugin v2.3.0 — September 2026<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Background\" data-screen-label=\"02\" data-speaker-notes=\"Card 2 — why the framework exists, and what grounds it.\" style=\"position:relative;background:#f3f2f2;color:#201e1d;font-family:'Archivo',system-ui,sans-serif;padding:60px 72px 80px;display:flex;flex-direction:column;gap:22px\">\n  <div>\n    <div style=\"font-size:26px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#605d5d;margin-bottom:10px\">Background<\u002Fdiv>\n    <h2 style=\"font-size:62px;font-weight:800;line-height:1.0;letter-spacing:-0.02em;margin:0 0 18px\">Built so a Functional Consultant can build AL the right way<\u002Fh2>\n    <div style=\"height:2px;background:#201e1d\"><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font-size:31px;line-height:1.3;margin:0;text-wrap:pretty\">This Agentic Development Framework was created to help Business Central Functional Consultants use AI to build AL extensions and apps the <strong>right<\u002Fstrong> way — though professional AL developers will find it just as useful.<\u002Fp>\n  <p style=\"font-size:28px;line-height:1.3;margin:0;text-wrap:pretty\">Whichever edition you run, the routine grounds the agent in explicit rules, official references and quality tooling rather than AI guesswork alone:<\u002Fp>\n  <div style=\"display:flex;flex-direction:column;gap:2px;background:#201e1d;border:2px solid #201e1d\">\n    <div style=\"background:#f3f2f2;padding:13px 24px\"><div style=\"font-size:29px;font-weight:800\">OCPF AL Development Standards Guide<\u002Fdiv><div style=\"font-size:25px;line-height:1.25\">The AL rules the routine applies at each step, fetched in automatically.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:13px 24px\"><div style=\"font-size:29px;font-weight:800\">OCPF Operations Guide<\u002Fdiv><div style=\"font-size:25px;line-height:1.25\">The procedures both editions share — sixteen sections, also fetched in.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:13px 24px\"><div style=\"font-size:29px;font-weight:800\">AL MCP Server<\u002Fdiv><div style=\"font-size:25px;line-height:1.25\">Build, publish, symbol and diagnostic tools, driven directly.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:13px 24px\"><div style=\"font-size:29px;font-weight:800\">BC Base App on Microsoft Learn<\u002Fdiv><div style=\"font-size:25px;line-height:1.25\">Official references instead of half-remembered platform behavior.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:13px 24px\"><div style=\"font-size:29px;font-weight:800\">BCQuality<\u002Fdiv><div style=\"font-size:25px;line-height:1.25\">A curated quality knowledge base, snapshotted per project.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:13px 24px\"><div style=\"font-size:29px;font-weight:800\">OCPF BC AL Patterns<\u002Fdiv><div style=\"font-size:25px;line-height:1.25\">A portable pattern library, consulted before diagnosing from scratch.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;right:38px;bottom:22px;font-size:24px;letter-spacing:0.04em;color:#7d7979\">© 2026 OnlyCopilotFans<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Three documents\" data-screen-label=\"03\" data-speaker-notes=\"Card 3 — sequence, rules, procedures: three documents, none repeating another.\" style=\"position:relative;background:#f3f2f2;color:#201e1d;font-family:'Archivo',system-ui,sans-serif;padding:60px 72px 80px;display:flex;flex-direction:column;gap:22px\">\n  <div>\n    <div style=\"font-size:26px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#605d5d;margin-bottom:10px\">How the framework is put together<\u002Fdiv>\n    <h2 style=\"font-size:62px;font-weight:800;line-height:1.0;letter-spacing:-0.02em;margin:0 0 18px\">Sequence, rules, procedures<\u002Fh2>\n    <div style=\"height:2px;background:#201e1d\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"border:2px solid #201e1d;border-left:14px solid #0F6CBD;padding:18px 24px\">\n      <div style=\"display:flex;align-items:baseline;gap:16px;flex-wrap:wrap\"><div style=\"font-size:34px;font-weight:800\">The Runbook<\u002Fdiv><div style=\"font-size:24px;font-weight:600;color:#444141\">Full v3.3.0.0 · Lite v2.2.0.0<\u002Fdiv><\u002Fdiv>\n      <div style=\"font-size:26px;line-height:1.3;margin-top:4px\">The ordered <strong>sequence<\u002Fstrong> — what happens when, who signs off, which gate opens the next step. Every step lists its Inputs, Actions, Outputs and Exit gate. One edition per project.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:2px solid #201e1d;border-left:14px solid #0A7C85;padding:18px 24px\">\n      <div style=\"display:flex;align-items:baseline;gap:16px;flex-wrap:wrap\"><div style=\"font-size:34px;font-weight:800\">AL Development Standards Guide<\u002Fdiv><div style=\"font-size:24px;font-weight:600;color:#444141\">v1.9.0.0 · cited as Standards §<\u002Fdiv><\u002Fdiv>\n      <div style=\"font-size:26px;line-height:1.3;margin-top:4px\">The AL <strong>rules<\u002Fstrong>, in Parts 1–10 and Appendices A–E: coding standards, API page design, field inclusion, naming, ID allocation, gap analysis, anti-patterns, translation, upgrade and data migration, events and extensibility — and AppSource manifest and submission requirements.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:2px solid #201e1d;border-left:14px solid #6B4FC4;padding:18px 24px\">\n      <div style=\"display:flex;align-items:baseline;gap:16px;flex-wrap:wrap\"><div style=\"font-size:34px;font-weight:800\">Operations Guide<\u002Fdiv><div style=\"font-size:24px;font-weight:600;color:#444141\">v1.2.0.0 · cited as Ops §<\u002Fdiv><\u002Fdiv>\n      <div style=\"font-size:26px;line-height:1.3;margin-top:4px\">The <strong>procedures<\u002Fstrong> both editions share, in sixteen sections: asking and approvals, intake, roles, project setup, AL tools, analyzers, symbols, editor sync, notifications, packaging, repository hygiene, translations, automated tests, fetched companions, reference sources, and the plugin.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;border:2px dashed #201e1d;padding:16px 24px;font-size:27px;line-height:1.35\">No document restates another. The agent fetches both companions into the project at the very first step and gitignores them there — you never copy them by hand, and a missing copy is a stop-and-ask, never a work-from-memory.<\u002Fdiv>\n  <div style=\"position:absolute;right:38px;bottom:22px;font-size:24px;letter-spacing:0.04em;color:#7d7979\">© 2026 OnlyCopilotFans<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Overview\" data-screen-label=\"04\" data-speaker-notes=\"Card 4 — four phases, ALL ALONG underneath.\" style=\"position:relative;background:#f3f2f2;color:#201e1d;font-family:'Archivo',system-ui,sans-serif;padding:60px 72px 80px;display:flex;flex-direction:column;gap:22px\">\n  <div>\n    <div style=\"font-size:26px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#605d5d;margin-bottom:10px\">Schematic 1<\u002Fdiv>\n    <h2 style=\"font-size:62px;font-weight:800;line-height:1.0;letter-spacing:-0.02em;margin:0 0 18px\">Four phases. Fourteen steps. A gate on every one.<\u002Fh2>\n    <div style=\"height:2px;background:#201e1d\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;align-items:center;gap:0\">\n    <div style=\"align-self:stretch;border:2px solid #201e1d;border-left:16px solid #0F6CBD;padding:18px 24px\"><div style=\"font-size:44px;font-weight:800;letter-spacing:-0.02em\">DEFINE<\u002Fdiv><div style=\"font-size:30px;line-height:1.3\">Scope the problem, fill in parameters. PRE-01 · PRE-02 · 01<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center\"><div style=\"width:2px;height:18px;background:#201e1d\"><\u002Fdiv><div style=\"width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid #201e1d\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"align-self:stretch;border:2px solid #201e1d;border-left:16px solid #0A7C85;padding:18px 24px\"><div style=\"font-size:44px;font-weight:800;letter-spacing:-0.02em\">DESIGN<\u002Fdiv><div style=\"font-size:30px;line-height:1.3\">FRD, plus a self-sufficient TDD. 02 e:32px;font-weight:800\">07 · Compile and Package, Troubleshoot, Iterate<\u002Fdiv>\n      <div style=\"font-size:28px;line-height:1.3;margin-top:4px\">One mandatory compile-and-package opens the step, analyzers engaged. <strong style=\"color:#6B4FC4\">Reasoning<\u002Fstrong> diagnoses root cause — patterns library first, then the three questions — <strong style=\"color:#0F6CBD\">Main<\u002Fstrong> fixes.<\u002Fdiv>\n      <div style=\"margin-top:10px;border-top:2px dashed #201e1d;padding-top:10px;font-size:26px;color:#444141\">↻ publish → test → diagnose → fix → repackage → redeploy — the rhythm of the rest of BUILD and PROVE<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center\"><div style=\"width:2px;height:16px;background:#201e1d\"><\u002Fdiv><div style=\"width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid #201e1d\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#201e1d;color:#f3f2f2;padding:12px 42px;font-size:26px;white-space:nowrap;clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,20px 100%,0 50%)\">0 errors / 0 warnings<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;right:38px;bottom:22px;font-size:24px;letter-spacing:0.04em;color:#7d7979\">© 2026 OnlyCopilotFans<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"PROVE\" data-screen-label=\"09\" data-speaker-notes=\"Card 9 — PROVE, five steps to production.\" style=\"position:relative;background:#f3f2f2;color:#201e1d;font-family:'Archivo',system-ui,sans-serif;padding:60px 72px 80px;display:flex;flex-direction:column;gap:20px\">\n  <div>\n    <div style=\"font-size:26px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#C10E72;margin-bottom:10px\">Phase 04 — schematic 2.4<\u002Fdiv>\n    <h2 style=\"font-size:62px;font-weight:800;line-height:1.0;letter-spacing:-0.02em;margin:0 0 18px\">PROVE — five steps to production<\u002Fh2>\n    <div style=\"height:2px;background:#201e1d\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;align-items:center;gap:0;flex:1\">\n    <div style=\"align-self:stretch;border:2px solid #201e1d;border-left:14px solid #6B4FC4;padding:12px 22px\"><div style=\"font-size:30px;font-weight:800\">08 · Gap-Fit Test, Fidelity Validation<\u002Fdiv><div style=\"font-size:27px;line-height:1.25\">Three-way comparison — FRD vs. TDD vs. as-built<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center\"><div style=\"width:2px;height:12px;background:#201e1d\"><\u002Fdiv><div style=\"width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #201e1d\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#201e1d;color:#f3f2f2;padding:10px 40px;font-size:25px;white-space:nowrap;clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,20px 100%,0 50%)\">Every gap classified; fixes recompiled and repackaged<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center\"><div style=\"width:2px;height:12px;background:#201e1d\"><\u002Fdiv><div style=\"width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #201e1d\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"align-self:stretch;border:2px solid #201e1d;border-left:14px solid #6B4FC4;padding:12px 22px\"><div style=\"font-size:30px;font-weight:800\">09 · Code Review<\u002Fdiv><div style=\"font-size:27px;line-height:1.25\">Standards Anti-Patterns, BCQuality pass, dead code, permission-set re-verify<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center\"><div style=\"width:2px;height:12px;background:#201e1d\"><\u002Fdiv><div style=\"width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #201e1d\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#201e1d;color:#f3 pts if asked for<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center\"><div style=\"width:2px;height:12px;background:#201e1d\"><\u002Fdiv><div style=\"width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #201e1d\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#201e1d;color:#f3f2f2;padding:10px 40px;font-size:25px;white-space:nowrap;clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,20px 100%,0 50%)\">Docs generated from code; formal hand-off to the human<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center\"><div style=\"width:2px;height:12px;background:#201e1d\"><\u002Fdiv><div style=\"width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #201e1d\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"align-self:stretch;border:2px solid #201e1d;border-left:14px solid #0F6CBD;padding:12px 22px\"><div style=\"font-size:30px;font-weight:800\">12 · Release to Users for Testing<\u002Fdiv><div style=\"font-size:27px;line-height:1.25\">Real users run the scripts end to end on a sandbox → docs/ReleaseTestResults.md<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center\"><div style=\"width:2px;height:12px;background:#201e1d\"><\u002Fdiv><div style=\"width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #201e1d\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#201e1d;color:#f3f2f2;padding:10px 40px;font-size:25px;white-space:nowrap;clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,20px 100%,0 50%)\">All pass → that exact package goes to Production<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;right:38px;bottom:22px;font-size:24px;letter-spacing:0.04em;color:#7d7979\">© 2026 OnlyCopilotFans<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\ :24px;font-weight:600;color:#444141\">Sub-Agent · a fast, lower-cost model · effort High (default)<\u002Fdiv><\u002Fdiv><div style=\"font-size:27px;line-height:1.3\">The post-generation pre-flight pass only — props, Rec.-qualification, dead code, indentation, coverage, symbol verification. Reports; never edits.<\u002Fdiv><\u002Fdiv>\n    <div style=\"align-self:stretch;border:2px solid #201e1d;border-top:14px solid #6B4FC4;padding:14px 24px;margin-bottom:12px\"><div style=\"display:flex;align-items:baseline;gap:16px;flex-wrap:wrap\"><div style=\"font-size:34px;font-weight:800\">REASONING ROLE<\u002Fdiv><div style=\"font-size:24px;font-weight:600;color:#444141\">Sub-Agent · the strongest reasoning model · effort High (default)<\u002Fdiv><\u002Fdiv><div style=\"font-size:27px;line-height:1.3\">Sanity Check, Gap-Fit Test, Code Review, FRD and TDD authorship, root-cause troubleshooting. Drafts and diagnoses; never edits code or continuity docs.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;right:38px;bottom:22px;font-size:24px;letter-spacing:0.04em;color:#7d7979\">© 2026 OnlyCopilotFans<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"ALL ALONG\" data-screen-label=\"11\" data-speaker-notes=\"Card 11 — the nineteen continuous disciplines.\" style=\"position:relative;background:#f3f2f2;color:#201e1d;font-family:'Archivo',system-ui,sans-serif;padding:60px 72px 80px;display:flex;flex-direction:column;gap:24px\">\n  <div>\n    <div style=\"font-size:26px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#605d5d;margin-bottom:10px\">Schematic 4 — cross-cutting<\u002Fdiv>\n    <h2 style=\"font-size:62px;font-weight:800;line-height:1.0;letter-spacing:-0.02em;margin:0 0 18px\">ALL ALONG — every phase, every step<\u002Fh2>\n    <div style=\"height:2px;background:#201e1d\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border:2px dashed #201e1d;padding:16px;flex:1;display:flex\"><div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;background:#201e1d\">\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">Document<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">Nineteen required documents, kept current.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">Track Changes<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">Every deviation logged before the next batch.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">Retain Explanations<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">Who decided, and why.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">Testing Feedback<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">Verbatim findings from Step 07 onward.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">Project Memory<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">An anchor for the project, not a narrative.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">Project Progress<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">One status row per step, PRE-01 to 12.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">Translations<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">Glossary, named reviewers, a release gate.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">Packaging &amp; Versioning<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">Packages kept; Schema Sync Mode flagged.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">Repository Hygiene<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">What never reaches the client's remote.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">AL MCP Server<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">Preferred over ad hoc terminal commands.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">Analyzers<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">CodeCop, UICop, and a per-target Cop.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">Symbols<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">Downloaded by the agent, never the human.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">Editor Sync<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">Stale red marks detected and refreshed.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">Notifications<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">The human is told when it's their turn.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">Standards Guide<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">Fetched at PRE-01, never recalled from memory.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">Reference Sources<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">Microsoft Learn and the AL Guidelines.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">BCQuality Snapshot<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">Fetched once, outside the project root.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">AL Patterns Library<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">Consulted before diagnosing from scratch.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:12px 14px;grid-column:span 3\"><div style=\"font-size:25px;font-weight:800;line-height:1.15;margin-bottom:4px\">OCPF Plugin<\u002Fdiv><div style=\"font-size:21px;line-height:1.3\">Optional — a once-per-session update check, offline copies of both companions, zero-install AL tool setup, and ready-made sub-agents.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n  <div style=\"position:absolute;right:38px;bottom:22px;font-size:24px;letter-spacing:0.04em;color:#7d7979\">© 2026 OnlyCopilotFans<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Lite Edition\" data-screen-label=\"12\" data-speaker-notes=\"Card 12 — Lite Edition: 7 steps, 4 documents, same AL rules.\" style=\"position:relative;background:#f3f2f2;color:#201e1d;font-family:'Archivo',system-ui,sans-serif;padding:60px 72px 80px;display:flex;flex-direction:column;gap:30px\">\n  <div>\n    <div style=\"font-size:26px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#C10E72;margin-bottom:10px\">Choosing an edition<\u002Fdiv>\n    <h2 style=\"font-size:62px;font-weight:800;line-height:1.0;letter-spacing:-0.02em;margin:0 0 18px\">Not every extension needs fourteen steps<\u002Fh2>\n    <div style=\"height:2px;background:#201e1d\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:24px\">\n    <div style=\"flex:1;border:2px solid #201e1d;border-top:14px solid #C10E72;padding:22px\">\n      <div style=\"font-size:34px;font-weight:800;margin-bottom:4px\">LITE<\u002Fdiv>\n      <div style=\"font-size:27px;font-weight:600;margin-bottom:12px\">7 steps · 4 documents<\u002Fdiv>\n      <div style=\"font-size:26px;line-height:1.35\">Roughly 5–10 AL files. One person driving, one AI model doing the work. No separate sign-off roles.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;border:2px solid #201e1d;border-top:14px solid #0F6CBD;padding:22px\">\n      <div style=\"font-size:34px;font-weight:800;margin-bottom:4px\">FULL<\u002Fdiv>\n      <div style=\"font-size:27px;font-weight:600;margin-bottom:12px\">14 steps · 19 documents<\u002Fdiv>\n      <div style=\"font-size:26px;line-height:1.35\">Past ~10 objects, multiple sign-off roles, the Main / Light / Reasoning split, or heading to AppSource.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border:2px dashed #201e1d;padding:22px 24px\">\n    <div style=\"font-size:32px;font-weight:800;margin-bottom:6px\">Lite reduces process, never the AL rules<\u002Fdiv>\n    <div style=\"font-size:27px;line-height:1.35\">Both editions fetch and apply the same Standards Guide and the same Operations Guide. The same rules apply to a 5-file extension as to a 50-file one.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:2px;background:#201e1d;border:2px solid #201e1d\">\n    <div style=\"background:#f3f2f2;padding:18px 22px;font-size:27px;line-height:1.3\">FRD + TDD + Sanity Check <strong>→ DesignDoc.md<\u002Fstrong><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:18px 22px;font-size:27px;line-height:1.3\">Testing Feedback Log + Roadmap <strong>→ ChangeLog.md<\u002Fstrong><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:18px 22px;font-size:27px;line-height:1.3\">Multi-model role split <strong>→ dropped<\u002Fstrong><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;font-size:27px;line-height:1.35;border-top:2px solid #201e1d;padding-top:18px\"><strong>Graduate to Full<\u002Fstrong> the moment the object count passes ~10, separate sign-off roles are involved, you want more than one model, or the app is heading to AppSource. Nothing is lost by switching later — <strong>DesignDoc.md<\u002Fstrong> maps onto the full framework's TDD and <strong>ChangeLog.md<\u002Fstrong> carries straight over. One edition per project, never both at once.<\u002Fdiv>\n  <div style=\"position:absolute;right:38px;bottom:22px;font-size:24px;letter-spacing:0.04em;color:#7d7979\">© 2026 OnlyCopilotFans<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Plugin\" data-screen-label=\"13\" data-speaker-notes=\"Card 13 — the ocpf-bc agent plugin.\" style=\"position:relative;background:#f3f2f2;color:#201e1d;font-family:'Archivo',system-ui,sans-serif;padding:60px 72px 80px;display:flex;flex-direction:column;gap:22px\">\n  <div>\n    <div style=\"font-size:26px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#0A7C85;margin-bottom:10px\">Install once, use everywhere<\u002Fdiv>\n    <h2 style=\"font-size:62px;font-weight:800;line-height:1.0;letter-spacing:-0.02em;margin:0 0 18px\">One command starts a project<\u002Fh2>\n    <div style=\"height:2px;background:#201e1d\"><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font-size:29px;line-height:1.3;margin:0;text-wrap:pretty\">The framework also ships as an agent plugin, <strong>ocpf-bc<\u002Fstrong> (v2.3.0), for Claude Code and GitHub Copilot in VS Code — and their CLIs. It's the easiest way in, and the manual setup still works exactly as before.<\u002Fp>\n  <div style=\"border:2px solid #201e1d;border-left:16px solid #0A7C85;padding:18px 24px\">\n    <div style=\"font-size:42px;font-weight:800;letter-spacing:-0.02em\">/ocpf-bc:start<\u002Fdiv>\n    <div style=\"font-size:26px;line-height:1.3;margin-top:6px\">Or just ask: <em>“Start a Business Central project with the OCPF framework.”<\u002Fem><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:2px;background:#201e1d;border:2px solid #201e1d\">\n    <div style=\"background:#f3f2f2;padding:14px 22px;font-size:27px;line-height:1.3\"><strong>Helps you choose Full or Lite<\u002Fstrong> — and explains why<\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:14px 22px;font-size:27px;line-height:1.3\"><strong>Installs the latest runbook<\u002Fstrong> — never a stale copy<\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:14px 22px;font-size:27px;line-height:1.3\"><strong>Connects Microsoft's AL tools<\u002Fstrong> — with nothing to install<\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:14px 22px;font-size:27px;line-height:1.3\"><strong>Adds ready-made sub-agents<\u002Fstrong> — for the Light and Reasoning roles<\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:14px 22px;font-size:27px;line-height:1.3\"><strong>Checks for updates every session<\u002Fstrong> — and asks before applying them<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:26px;line-height:1.35\">Six skills: <strong>start<\u002Fstrong> · <strong>status<\u002Fstrong> · <strong>al-standards<\u002Fstrong> · <strong>al-mcp-setup<\u002Fstrong> · <strong>notifications<\u002Fstrong> · <strong>update-framework<\u002Fstrong><\u002Fdiv>\n  <div style=\"margin-top:auto;border:2px dashed #201e1d;padding:16px 24px;font-size:26px;line-height:1.35\">The repository is its own marketplace: add <strong>ajansari/ocpfBcAgenticDevFramework<\u002Fstrong>, then install <strong>ocpf-bc<\u002Fstrong>. The Claude apps, Microsoft Copilot Cowork and the github.com cloud agent can also run it, and aren't yet fully vetted — with no AL compiler there, they cover DEFINE and DESIGN, and BUILD and PROVE continue in VS Code.<\u002Fdiv>\n  <div style=\"position:absolute;right:38px;bottom:22px;font-size:24px;letter-spacing:0.04em;color:#7d7979\">© 2026 OnlyCopilotFans<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Multilanguage\" data-screen-label=\"14\" data-speaker-notes=\"Card 14 — multilanguage support, built in from the ground up.\" style=\"position:relative;background:#f3f2f2;color:#201e1d;font-family:'Archivo',system-ui,sans-serif;padding:60px 72px 80px;display:flex;flex-direction:column;gap:22px\">\n  <div>\n    <div style=\"font-size:26px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#C10E72;margin-bottom:10px\">Both editions, from the ground up<\u002Fdiv>\n    <h2 style=\"font-size:62px;font-weight:800;line-height:1.0;letter-spacing:-0.02em;margin:0 0 18px\">Multilanguage, not bolted on<\u002Fh2>\n    <div style=\"height:2px;background:#201e1d\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:2px;background:#201e1d;border:2px solid #201e1d\">\n    <div style=\"background:#f3f2f2;padding:13px 24px\"><div style=\"font-size:29px;font-weight:800\">No ML syntax, ever<\u002Fdiv><div style=\"font-size:25px;line-height:1.25\">Caption plus XLIFF (.xlf) files — never the deprecated CaptionML. Code Review flags it wherever it appears.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:13px 24px\"><div style=\"font-size:29px;font-weight:800\">Country first, then language<\u002Fdiv><div style=\"font-size:25px;line-height:1.25\">Intake offers only the languages BC actually supports there, read from Microsoft's live availability page.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:13px 24px\"><div style=\"font-size:29px;font-weight:800\">Terminology from Microsoft<\u002Fdiv><div style=\"font-size:25px;line-height:1.25\">Australia says GST, not VAT — and CR/Adj Note, not Credit Memo. Checked against Microsoft's own translations, not recalled.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:13px 24px\"><div style=\"font-size:29px;font-weight:800\">A named human approves<\u002Fdiv><div style=\"font-size:25px;line-height:1.25\">The agent drafts translations; nothing ships until a named reviewer signs each one off.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:13px 24px\"><div style=\"font-size:29px;font-weight:800\">UAT in every required language<\u002Fdiv><div style=\"font-size:25px;line-height:1.25\">The release test runs a language pass per required language, by someone who speaks it.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f3f2f2;padding:13px 24px\"><div style=\"font-size:29px;font-weight:800\">Work in your own language<\u002Fdiv><div style=\"font-size:25px;line-height:1.25\">The working language is the first question the routine asks, before anything else.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;border:2px dashed #201e1d;padding:16px 24px;font-size:27px;line-height:1.35\">AppSource requires XLIFF translation files, so an app built any other way isn't on the path to AppSource. The rules are Standards Part 8; the workflow is Ops § Translations.<\u002Fdiv>\n  <div style=\"position:absolute;right:38px;bottom:22px;font-size:24px;letter-spacing:0.04em;color:#7d7979\">© 2026 OnlyCopilotFans<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Close\" data-screen-label=\"15\" data-speaker-notes=\"Card 15 — close on the tagline.\" style=\"position:relative;background:#201e1d;color:#f3f2f2;font-family:'Archivo',system-ui,sans-serif;padding:72px 72px 90px;display:flex;flex-direction:column;justify-content:space-between\">\n  <div style=\"font-size:26px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase\">OnlyCopilotFans — Agentic Development Framework<\u002Fdiv>\n  <div>\n    <p style=\"font-size:72px;font-weight:800;line-height:1.1;letter-spacing:-0.03em;margin:0 0 40px\">Simple Enough for Functional Consultants. <br><br>Robust Enough for Pro Developers.<\u002Fp>\n    <div style=\"height:2px;background:#f3f2f2;margin-bottom:40px\"><\u002Fdiv>\n    <div style=\"font-size:32px;font-weight:600\">Created by AJ Ansari, Microsoft MVP<\u002Fdiv>\n    <div style=\"font-size:26px;font-weight:500;margin-top:12px;color:rgba(243,242,242,0.82)\">github.com/ajansari/ocpfBcAgenticDevFramework · MIT licensed<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:0;height:10px\">\n    <div style=\"flex:1;background:#0F6CBD\"><\u002Fdiv><div style=\"flex:1;background:#0A7C85\"><\u002Fdiv><div style=\"flex:1;background:#6B4FC4\"><\u002Fdiv><div style=\"flex:1;background:#C10E72\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;right:38px;bottom:22px;font-size:24px;letter-spacing:0.04em;color:rgba(243,242,242,0.72)\">© 2026 OnlyCopilotFans<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
